---
# 91video deployment
# (live copy on Unraid: /mnt/user/appdata/91video/compose.yaml)
# Usage: docker compose pull -f compose.yaml && docker compose up -d
services:
  91video:
    image: bear0328/91video:latest # public repo, no login required
    container_name: 91video
    ports:
      - "8620:8620" # web UI (download + playback)
    volumes:
      - /mnt/user/media/ori/91:/data # media library
      #   (change to your own path)
      - /mnt/user/appdata/91video/data:/appdata # app data (tasks etc.)
    environment:
      - PAGE_PROXY=http://192.168.6.111:7890 # proxy for pages (REQUIRED)
      - APPDATA=/appdata # app data dir
    # - CDN_PROXY=http://...  # proxy for video downloads, follows
    #   PAGE_PROXY by default; "" forces direct
    restart: unless-stopped
